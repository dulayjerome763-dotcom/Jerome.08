<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achievements | Jerome Dulay</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

    <!-- Compact layout so all three sections fit on one screen (no scrolling).
         You can move this block into style.css if you prefer. -->
    <style>
        main .page-section {
            padding-top: 1.5rem;
            padding-bottom: 1.5rem;
        }

        main .page-section h2 {
            margin-bottom: 1.25rem;
        }

        .achievement-columns {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            max-width: 1100px;
            margin: 0 auto;
        }

        .achievement-group .subsection-title {
            margin: 0 0 0.75rem;
            font-size: 1.1rem;
            text-align: center;
        }

        .achievement-group .cards {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin: 0;
            padding: 0;
        }

        .achievement-group .card {
            width: auto;
            max-width: none;
            margin: 0;
            padding: 0.7rem 1rem;
        }

        .achievement-group .card h3 {
            margin: 0 0 0.25rem;
            font-size: 1rem;
        }

        .achievement-group .card p {
            margin: 0;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        /* Stack the columns on small screens (scrolling is fine there) */
        @media (max-width: 800px) {
            .achievement-columns {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
